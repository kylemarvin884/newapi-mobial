services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    networks:
      - mobile_backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - mobile_redis:/data
    networks:
      - mobile_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

networks:
  mobile_backend:
    driver: bridge

volumes:
  mobile_redis:

